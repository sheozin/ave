<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CueDeck Check-in</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="theme-color" content="#F5F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── DESIGN TOKENS — LIGHT ──────────────────────────
   The check-in desk lives in a bright hotel lobby, so this page is
   light while the console/display are dark. Do not port dark tokens
   in from the other pages.                                        */
:root {
  --pg:#F5F5F7; --sf:#FFFFFF; --wm:#FBFBFD;
  --t1:#1D1D1F; --t2:#6E6E73; --t3:#A1A1A6;
  --bd:#E8E8ED; --bd2:#D2D2D7;
  --ac:#0071E3; --acsf:#EAF3FE;
  --gn:#1D8348; --gnsf:#E8F6EE; --gnbd:#B7E4C9;
  --am:#9A5B00; --amsf:#FEF6E7; --ambd:#F5D9A8;
  --rd:#B3261E; --rdsf:#FDECEA; --rdbd:#F5C3BD;
  --radius:16px; --radius-lg:22px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
}

/* ── RESET & BASE ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:var(--pg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;color:var(--t1);
  font-size:15px;line-height:1.5;
}
button,input{font-family:inherit;font-size:inherit;color:inherit}

/* ── CENTRED SCREENS (sign-in, picker) ── */
.ck-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px 20px;
}
.ck-card{
  width:100%;max-width:420px;background:var(--sf);
  border:1px solid var(--bd);border-radius:var(--radius-lg);
  padding:40px 36px;box-shadow:var(--shadow);
}
.ck-card.wide{max-width:560px}
.ck-logo{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
.ck-logo span{color:var(--ac)}
.ck-sub{font-size:12px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:30px}
.ck-lbl{
  display:block;font-size:12px;font-weight:600;color:var(--t2);
  margin-bottom:7px;letter-spacing:.01em;
}
.ck-input{
  width:100%;background:var(--wm);border:1px solid var(--bd2);
  border-radius:12px;padding:13px 15px;outline:none;margin-bottom:16px;
  transition:border-color .14s, box-shadow .14s, background .14s;
}
.ck-input:focus{border-color:var(--ac);background:var(--sf);box-shadow:0 0 0 4px var(--acsf)}
.ck-btn{
  width:100%;padding:14px;background:var(--ac);color:#fff;border:none;
  border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;
  transition:opacity .14s, transform .06s;
}
.ck-btn:hover{opacity:.9}
.ck-btn:active{transform:scale(.99)}
.ck-btn:disabled{opacity:.5;cursor:default;transform:none}
.ck-err{
  color:#B3261E;font-size:13px;min-height:19px;margin-bottom:10px;
}
.ck-note{
  background:var(--amsf);border:1px solid var(--ambd);color:var(--am);
  border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:18px;
}
.ck-quiet{
  background:none;border:none;color:var(--ac);font-size:14px;font-weight:500;
  cursor:pointer;padding:6px 0;
}
.ck-quiet:hover{text-decoration:underline}

/* ── EVENT PICKER LIST ── */
.ck-ev-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.ck-ev{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--wm);border:1px solid var(--bd);border-radius:var(--radius);
  padding:16px 18px;cursor:pointer;
  transition:border-color .14s, background .14s, box-shadow .14s;
}
.ck-ev:hover{border-color:var(--ac);background:var(--sf);box-shadow:var(--shadow)}
.ck-ev-main{flex:1;min-width:0}
.ck-ev-name{font-size:16px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.ck-ev-meta{font-size:13px;color:var(--t2);margin-top:2px}
.ck-pill{
  flex:none;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--t2);background:var(--sf);border:1px solid var(--bd2);
  border-radius:999px;padding:4px 10px;
}
.ck-empty{color:var(--t2);font-size:14px;padding:6px 0 20px}

/* ── STATION HEADER ── */
#station{display:none;min-height:100vh;flex-direction:column}
.ck-header{
  position:sticky;top:0;z-index:10;background:var(--sf);
  border-bottom:1px solid var(--bd);padding:18px 24px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.ck-hd-main{flex:1;min-width:0}
.ck-hd-eyebrow{font-size:11px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase}
.ck-hd-name{font-size:20px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.ck-count{
  flex:none;text-align:right;background:var(--gnsf);border:1px solid var(--gnbd);
  border-radius:var(--radius);padding:10px 18px;
}
.ck-count-num{font-size:20px;font-weight:700;color:var(--gn);font-variant-numeric:tabular-nums}
.ck-count-lbl{font-size:11px;color:var(--gn);letter-spacing:.1em;text-transform:uppercase;opacity:.85}

/* ── SYNC PILL ────────────────────────────────────
   Amber whenever work is queued or the desk is offline, green only
   when everything has reached the server. Amber is not an alarm here:
   a desk running offline is the normal case this module exists for. */
.ck-sync{
  flex:none;border:1px solid;border-radius:999px;padding:8px 14px;
  font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
}
.ck-sync.clear{background:var(--gnsf);border-color:var(--gnbd);color:var(--gn)}
.ck-sync.wait{background:var(--amsf);border-color:var(--ambd);color:var(--am)}
.ck-hd-actions{flex:none;display:flex;gap:8px}
.ck-body{flex:1;padding:32px 24px;display:flex;justify-content:center;align-items:flex-start}
.ck-panel{
  width:100%;max-width:720px;background:var(--sf);border:1px solid var(--bd);
  border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow);
}
.ck-panel-title{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.ck-panel-text{font-size:14px;color:var(--t2)}

/* ── SCAN / SEARCH FIELD ──────────────────────────
   One field for both inputs: a USB scanner types the token and sends
   Enter, a person types a name. Big type because it is read across a
   desk, not from a chair.                                          */
.ck-scan{font-size:19px;padding:16px 18px;margin-bottom:0}
.ck-scan-hint{font-size:13px;color:var(--t2);margin-top:9px}

/* ── NAME SEARCH RESULTS ── */
.ck-res{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.ck-res-btn{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--wm);border:1px solid var(--bd);border-radius:12px;
  padding:12px 15px;cursor:pointer;transition:border-color .14s, background .14s;
}
.ck-res-btn:hover{border-color:var(--ac);background:var(--sf)}
.ck-res-main{flex:1;min-width:0}
.ck-res-name{font-weight:600;overflow-wrap:anywhere}
.ck-res-meta{font-size:13px;color:var(--t2);overflow-wrap:anywhere}
.ck-res-note{font-size:13px;color:var(--t2);margin-top:14px}

/* ── VERDICT ──────────────────────────────────────
   Three states, each carrying its own instruction. Amber is not an
   error: a second scan of the same code is normal at a busy desk.  */
.ck-vd{border:1px solid;border-radius:var(--radius);padding:18px 20px;margin-top:20px}
.ck-vd-h{font-size:17px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.ck-vd-t{font-size:14px;margin-top:6px}
.ck-vd-ok{background:var(--gnsf);border-color:var(--gnbd)}
.ck-vd-ok .ck-vd-h{color:var(--gn)}
.ck-vd-ok .ck-vd-t{color:var(--gn)}
.ck-vd-dup{background:var(--amsf);border-color:var(--ambd)}
.ck-vd-dup .ck-vd-h{color:var(--am)}
.ck-vd-dup .ck-vd-t{color:var(--am)}
.ck-vd-bad{background:var(--rdsf);border-color:var(--rdbd)}
.ck-vd-bad .ck-vd-h{color:var(--rd)}
.ck-vd-bad .ck-vd-t{color:var(--rd)}
.ck-vd .ck-quiet{margin-top:8px}

/* ── PARTY CARD ───────────────────────────────────
   The unit of work is an arrival, not a scan: one to five people from
   one company, checked in together. A lone attendee is a party of one
   and gets the same card.                                          */
.ck-party{margin-top:20px;border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden}
.ck-party-hd{background:var(--wm);border-bottom:1px solid var(--bd);padding:15px 18px}
.ck-party-co{font-size:16px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.ck-party-sub{font-size:13px;color:var(--t2);margin-top:2px}
.prow{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:none}
.prow>div{flex:1;min-width:0}
.tick{
  flex:none;width:36px;height:36px;border-radius:10px;padding:0;
  border:2px solid var(--bd2);background:var(--sf);cursor:pointer;
  font-size:18px;font-weight:700;line-height:1;
  transition:background .14s, border-color .14s;
}
.tick:hover{border-color:var(--ac)}
.tick.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tick.done{background:var(--gn);border-color:var(--gn);color:#fff;cursor:default}
.tick.done:hover{border-color:var(--gn)}
.pn{font-weight:600;overflow-wrap:anywhere}
.pm{font-size:13px;color:var(--t2);overflow-wrap:anywhere}
.pill-in,.pill-un,.pill-go{
  flex:none;font-size:12px;font-weight:600;border-radius:999px;
  padding:5px 11px;white-space:nowrap;
}
.pill-in{background:var(--gnsf);color:var(--gn);border:1px solid var(--gnbd)}
.pill-un{background:var(--wm);color:var(--t2);border:1px solid var(--bd2)}
.pill-go{background:var(--acsf);color:var(--ac);border:1px solid var(--ac)}

/* ── DESK ACTIONS ── */
.ck-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.ck-actions .ck-btn{flex:1 1 220px}
.ck-btn.ghost{background:var(--sf);color:var(--t1);border:1px solid var(--bd2)}
.ck-btn.ghost:hover{opacity:1;border-color:var(--t3)}

/* ── LOADING ── */
#loading{
  position:fixed;inset:0;background:var(--pg);display:none;
  align-items:center;justify-content:center;z-index:9998;
}
.ck-spin{
  width:26px;height:26px;border:2px solid var(--bd2);
  border-top-color:var(--ac);border-radius:50%;animation:ck-rot .8s linear infinite;
}
@keyframes ck-rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ── SIGN IN ─────────────────────────────────── -->
<div id="signin" class="ck-screen">
  <form id="signin-form" class="ck-card" autocomplete="on">
    <div class="ck-logo">Cue<span>Deck</span></div>
    <div class="ck-sub">Check-in</div>
    <label class="ck-lbl" for="si-email">Email</label>
    <input class="ck-input" id="si-email" type="email" autocomplete="username" required>
    <label class="ck-lbl" for="si-password">Password</label>
    <input class="ck-input" id="si-password" type="password" autocomplete="current-password" required>
    <div class="ck-err" id="si-err"></div>
    <button class="ck-btn" type="submit" id="si-btn">Sign in</button>
  </form>
</div>

<!-- ── EVENT PICKER ────────────────────────────── -->
<div id="picker" class="ck-screen" style="display:none">
  <div class="ck-card wide">
    <div class="ck-logo">Cue<span>Deck</span></div>
    <div class="ck-sub">Choose an event</div>
    <div class="ck-note" id="pk-note" style="display:none"></div>
    <div class="ck-ev-list" id="pk-list"></div>
    <button class="ck-quiet" type="button" id="pk-signout">Sign out</button>
  </div>
</div>

<!-- ── STATION ─────────────────────────────────── -->
<div id="station">
  <header class="ck-header">
    <div class="ck-hd-main">
      <div class="ck-hd-eyebrow">Check-in desk</div>
      <div class="ck-hd-name" id="st-event"></div>
    </div>
    <div class="ck-sync clear" id="st-sync">All synced</div>
    <div class="ck-count">
      <div class="ck-count-num" id="st-count">0 of 0</div>
      <div class="ck-count-lbl">Arrived</div>
    </div>
    <div class="ck-hd-actions">
      <button class="ck-quiet" type="button" id="st-switch">Switch event</button>
    </div>
  </header>
  <div class="ck-body">
    <div class="ck-panel">
      <label class="ck-lbl" for="scan">Scan a QR code, or type a name</label>
      <input class="ck-input ck-scan" id="scan" type="text" autocomplete="off" spellcheck="false"
             placeholder="Scan a badge, or start typing a name">
      <div class="ck-scan-hint">Point the scanner at the QR code, or type two or more letters of a name, company or email.</div>
      <div id="results"></div>
      <div id="verdict"></div>
      <div id="party"></div>
      <div class="ck-actions" id="actions" style="display:none">
        <button class="ck-btn" type="button" id="primary"></button>
        <button class="ck-btn ghost" type="button" id="secondary">Check in without printing</button>
      </div>
      <div class="ck-panel-text" id="st-status" style="margin-top:24px"></div>
    </div>
  </div>
</div>

<!-- ── LOADING ─────────────────────────────────── -->
<div id="loading"><div class="ck-spin"></div></div>

<script>
// ═══════════════════════════════════════════════════
// CREDENTIALS (hardcoded — same project as console/display)
// ═══════════════════════════════════════════════════
const SUPABASE_URL      = 'https://sawekpguemzvuvvulfbc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_FJg1ZR0rwYeP3EwQu4xRNA_WqEp4PaB';

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let sb = null;
// S.party is the arrival currently at the desk: the people the card is
// showing, plus the ids ticked as present. Null when the desk is idle.
var S = { user: null, event: null, role: null, roster: [], party: null, scanPointId: null };  // var → window.S for E2E tests

// ═══════════════════════════════════════════════════
// OFFLINE CACHE (IndexedDB)
// The desk must keep resolving scans when venue wifi dies, so the
// roster is mirrored locally and every action is queued in STORE_OUTBOX
// until the server acknowledges it. Both survive a page reload.
// ═══════════════════════════════════════════════════
const DB_NAME = 'cuedeck-checkin';
const STORE_ROSTER = 'roster';
const STORE_OUTBOX = 'outbox';

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_ROSTER)) db.createObjectStore(STORE_ROSTER, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(STORE_OUTBOX)) db.createObjectStore(STORE_OUTBOX, { keyPath: 'client_id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbPutAll(store, rows) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    rows.forEach(r => tx.objectStore(store).put(r));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGetAll(store) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Roster rows are keyed on attendee id with no per-event partition, so a
// tablet worked at two events in one day would keep both rosters. Drop the
// other event's rows on switch. STORE_OUTBOX is deliberately untouched:
// unsynced scans from another event are real check-ins and must survive.
async function idbClearOtherEvents(eventId) {
  const db = await openDb();
  const rows = await idbGetAll(STORE_ROSTER);
  const stale = rows.filter(r => r.event_id !== eventId).map(r => r.id);
  if (!stale.length) return;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_ROSTER, 'readwrite');
    stale.forEach(id => tx.objectStore(STORE_ROSTER).delete(id));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ═══════════════════════════════════════════════════
// ROSTER
// ═══════════════════════════════════════════════════
async function loadRoster(eventId) {
  const { data, error } = await sb
    .from('leod_checkin_attendees')
    .select('id,event_id,first_name,last_name,email,company,ticket_type,qr_token,checked_in_at,badge_printed_at')
    .eq('event_id', eventId);
  if (error) {
    // Offline or fetch failed: fall back to the cached copy, scoped to
    // THIS event. The store is keyed on attendee id and can hold rows
    // from a previous event if this device worked two events in a day,
    // so an unfiltered read would mix rosters.
    const cached = await idbGetAll(STORE_ROSTER);
    S.roster = cached.filter(a => a.event_id === eventId);
    return;
  }
  S.roster = data;
  await idbPutAll(STORE_ROSTER, data);
  await overlayPending();
}

// The server copy knows nothing about actions still sitting in the
// outbox, so a fresh fetch would show people the desk has already
// accepted as not arrived — after a reload, or after a flush that
// settled only part of the queue. Re-apply the queue on top. Applied in
// scanned_at order so a checkin and its later undo net out, exactly as
// the server will replay them. The offline branch above skips this: the
// cached rows already carry these writes.
async function overlayPending() {
  const pending = replayOrder(await idbGetAll(STORE_OUTBOX));
  const touched = [];
  for (const p of pending) {
    const a = S.roster.find(x => x.id === p.attendee_id);
    if (!a) continue;
    if (p.action === 'checkin' && !a.checked_in_at) a.checked_in_at = p.scanned_at;
    else if (p.action === 'undo' && a.checked_in_at === p.prev_checked_in_at) a.checked_in_at = null;
    else continue;
    touched.push(a);
  }
  if (touched.length) await idbPutAll(STORE_ROSTER, touched);
}

// ═══════════════════════════════════════════════════
// OUTBOX
// Every action is written here before anything else happens, so a desk
// that loses power mid-morning comes back with its check-ins intact.
// These two helpers are mirrored in tests/checkin-outbox.spec.ts — keep
// them character-identical.
//
// The spec's enqueue() and markSynced() are expressed through the store
// itself: STORE_OUTBOX has keyPath 'client_id', so a put is the dedup,
// and marking synced is a put of the same item with synced:true.
//
// There is deliberately NO client-side collapsing of a checkin and its
// undo. The server applies items in order and nets out correctly; an
// earlier collapse() caused a corrected mistake to be re-applied on the
// next flush.
// ═══════════════════════════════════════════════════
function pendingCount(outbox) { return outbox.filter(p => !p.synced).length; }

function replayOrder(outbox) {
  return outbox.filter(p => !p.synced).slice()
    .sort((a, b) => (a.scanned_at < b.scanned_at ? -1 : a.scanned_at > b.scanned_at ? 1 : 0));
}

// Synced items are kept for a day so a desk can still account for what
// it sent, then dropped so the store does not grow all event. Unsynced
// items are NEVER pruned: they are the check-ins.
// Pruning closes the local dedup window — once a client_id is gone from
// here this device could in principle re-send it. That is acceptable
// because the local store was never the real guard: the unique index on
// leod_checkin_scan_events.client_id is, and the server replays the
// original verdict instead of applying the item twice.
async function pruneOutbox() {
  const cutoff = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
  const rows = await idbGetAll(STORE_OUTBOX);
  const stale = rows.filter(p => p.synced && p.scanned_at < cutoff).map(p => p.client_id);
  if (!stale.length) return;
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_OUTBOX, 'readwrite');
    stale.forEach(id => tx.objectStore(STORE_OUTBOX).delete(id));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// The server rejects a batch larger than this with a 400. A desk offline
// through a keynote can queue hundreds of scans, and sending them as one
// request would be rejected every time — the outbox would never drain,
// and the livelock would get worse the longer the desk had been offline.
const MAX_BATCH = 200;

let flushing = false;

async function flushOutbox() {
  if (flushing || !navigator.onLine) return;
  flushing = true;
  try {
    const pending = replayOrder(await idbGetAll(STORE_OUTBOX));
    if (!pending.length) return;

    // Items carry the event they were scanned at. The outbox deliberately
    // survives an event switch, so flushing everything under whichever
    // event happens to be open would hand yesterday's attendees to
    // today's event: the server answers 'wrong_event', the client_id is
    // spent, and that check-in is lost for good. Group instead, so each
    // batch is sent under its own event_id.
    const byEvent = new Map();
    for (const p of pending) {
      if (!byEvent.has(p.event_id)) byEvent.set(p.event_id, []);
      byEvent.get(p.event_id).push(p);
    }
    const chunks = [];
    for (const [eventId, items] of byEvent) {
      for (let i = 0; i < items.length; i += MAX_BATCH) {
        chunks.push({ eventId, items: items.slice(i, i + MAX_BATCH) });
      }
    }

    let settledAny = false;
    for (const chunk of chunks) {
      const { data, error } = await sb.functions.invoke('checkin-record-scans', {
        // operator_id is not sent: the server derives it from the JWT and
        // ignores the body.
        body: {
          event_id: chunk.eventId,
          scan_point_id: S.scanPointId ?? null,
          items: chunk.items.map(({ client_id, attendee_id, scanned_at, action, prev_checked_in_at }) =>
            ({ client_id, attendee_id, scanned_at, action, prev_checked_in_at })),
        },
      });
      // Transport failure or a response we cannot read: stop the run and
      // leave everything unsynced. The next flush re-sends, and the
      // server dedups on client_id, so nothing is applied twice.
      if (error || !data || !data.results) break;

      // results[client_id] is either a real verdict (ok, duplicate,
      // unknown_token, wrong_event, undo) or the literal string 'error',
      // which means that item FAILED. Marking an 'error' synced would
      // silently drop a check-in, so only genuine verdicts settle.
      const settled = chunk.items
        .filter(p => data.results[p.client_id] && data.results[p.client_id] !== 'error')
        .map(p => ({ ...p, synced: true }));
      if (settled.length) {
        await idbPutAll(STORE_OUTBOX, settled);
        settledAny = true;
      }
    }

    await renderPendingCount();

    // The server is the authority on verdicts. The desk showed an
    // optimistic 'ok'; the server may have answered 'duplicate' because
    // another desk got there first. Pull the roster back so the card and
    // the head count stop disagreeing with it.
    if (settledAny && navigator.onLine && S.event) {
      await loadRoster(S.event.id);
      if (S.party) {
        const byId = new Map(S.roster.map(a => [a.id, a]));
        S.party.members = S.party.members.map(m => byId.get(m.id) || m);
      }
      renderParty();
      renderCount();
    }
  } finally {
    flushing = false;
  }
}

// The guard above is what keeps the timer and the 'online' event from
// sending the same batch twice.
window.addEventListener('online',  () => { renderPendingCount(); flushOutbox(); });
window.addEventListener('offline', () => { renderPendingCount(); });
setInterval(flushOutbox, 15000);

// ═══════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('signin-form').addEventListener('submit', handleSignIn);
  document.getElementById('pk-signout').addEventListener('click', signOut);
  document.getElementById('st-switch').addEventListener('click', showPicker);

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    S.user = session.user;
    await showPicker();
  } else {
    showScreen('signin');
    document.getElementById('si-email').focus();
  }
});

function showScreen(name) {
  document.getElementById('signin').style.display  = name === 'signin'  ? 'flex' : 'none';
  document.getElementById('picker').style.display  = name === 'picker'  ? 'flex' : 'none';
  document.getElementById('station').style.display = name === 'station' ? 'flex' : 'none';
  document.getElementById('loading').style.display = name === 'loading' ? 'flex' : 'none';
  if (name === 'station') { startFocusBackstop(); holdFocus(); }
  else stopFocusBackstop();
}

// ═══════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════
async function handleSignIn(e) {
  e.preventDefault();
  const email    = document.getElementById('si-email').value.trim();
  const password = document.getElementById('si-password').value;
  const btn      = document.getElementById('si-btn');
  const errEl    = document.getElementById('si-err');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  errEl.textContent = '';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  btn.textContent = 'Sign in';
  if (error) { errEl.textContent = error.message; return; }

  S.user = data.user;
  document.getElementById('si-password').value = '';
  await showPicker();
}

async function signOut() {
  await sb.auth.signOut();
  S.user = null; S.event = null; S.role = null; S.roster = []; S.party = null;
  showScreen('signin');
}

// ═══════════════════════════════════════════════════
// EVENT PICKER
// Every node below is built with createElement + textContent:
// event names are operator-supplied text and must never be parsed
// as markup.
// ═══════════════════════════════════════════════════
async function showPicker() {
  showScreen('loading');
  const note = document.getElementById('pk-note');
  const list = document.getElementById('pk-list');
  note.style.display = 'none';
  note.textContent = '';
  list.replaceChildren();

  // RLS on leod_checkin_operators exposes every operator row of an
  // event you belong to, so filter to this user explicitly.
  const { data: grants, error } = await sb
    .from('leod_checkin_operators')
    .select('event_id,role')
    .eq('user_id', S.user.id);

  if (error) {
    note.textContent = 'Could not load your events: ' + error.message;
    note.style.display = 'block';
    showScreen('picker');
    return;
  }

  const ids = (grants || []).map(g => g.event_id);
  if (!ids.length) {
    const empty = document.createElement('div');
    empty.className = 'ck-empty';
    empty.textContent = 'You have no check-in events yet.';
    list.appendChild(empty);
    showScreen('picker');
    return;
  }

  // Event rows may be unreadable to a crew operator (leod_events RLS
  // is owner-scoped), so a missing name is expected, not an error.
  const { data: events } = await sb
    .from('leod_events')
    .select('id,name,date')
    .in('id', ids);
  const byId = new Map((events || []).map(ev => [ev.id, ev]));

  grants.forEach(g => {
    const ev = byId.get(g.event_id);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ck-ev';

    const main = document.createElement('div');
    main.className = 'ck-ev-main';
    const name = document.createElement('div');
    name.className = 'ck-ev-name';
    name.textContent = (ev && ev.name) ? ev.name : 'Untitled event';
    const meta = document.createElement('div');
    meta.className = 'ck-ev-meta';
    meta.textContent = (ev && ev.date) ? ev.date : g.event_id;
    main.appendChild(name);
    main.appendChild(meta);

    const pill = document.createElement('span');
    pill.className = 'ck-pill';
    pill.textContent = g.role;

    btn.appendChild(main);
    btn.appendChild(pill);
    btn.addEventListener('click', () => openEvent(g.event_id, ev || null, g.role));
    list.appendChild(btn);
  });

  showScreen('picker');
}

// ═══════════════════════════════════════════════════
// OPEN EVENT
// ═══════════════════════════════════════════════════
async function openEvent(eventId, ev, role) {
  showScreen('loading');

  // Entitlement gate. A missing row counts as not enabled: RLS hides
  // the entitlements row entirely when checkin_core is false.
  const { data: ent } = await sb
    .from('leod_checkin_entitlements')
    .select('checkin_core')
    .eq('event_id', eventId)
    .maybeSingle();

  if (!ent || ent.checkin_core !== true) {
    const note = document.getElementById('pk-note');
    note.textContent = 'Check-in is not enabled for this event';
    note.style.display = 'block';
    showScreen('picker');
    return;
  }

  S.event = ev ? { id: eventId, name: ev.name, date: ev.date } : { id: eventId, name: null, date: null };
  S.role  = role;

  await idbClearOtherEvents(eventId);
  await pruneOutbox();
  await loadRoster(eventId);
  renderStation();
  showScreen('station');
}

// ═══════════════════════════════════════════════════
// STATION HEADER
// ═══════════════════════════════════════════════════
function renderStation() {
  document.getElementById('st-event').textContent = (S.event && S.event.name) ? S.event.name : 'Untitled event';
  resetDesk();
  renderCount();
  renderPendingCount();
  flushOutbox();
}

// Online/offline state and the size of the queue, in words rather than
// an icon: a volunteer needs to know at a glance whether the desk still
// owes the server anything before they walk away from it.
async function renderPendingCount() {
  const n = pendingCount(await idbGetAll(STORE_OUTBOX));
  const offline = !navigator.onLine;
  const el = document.getElementById('st-sync');
  el.className = 'ck-sync ' + (n || offline ? 'wait' : 'clear');
  el.textContent = n
    ? (offline ? 'Offline · ' : '') + n + ' waiting to sync'
    : (offline ? 'Offline' : 'All synced');
}

function renderCount() {
  const total   = S.roster.length;
  const arrived = S.roster.filter(a => a.checked_in_at).length;
  document.getElementById('st-count').textContent = arrived + ' of ' + total;
  document.getElementById('st-status').textContent =
    total + ' attendees cached on this device. The desk keeps working if the venue network drops.';
}

// ═══════════════════════════════════════════════════
// SCAN RESOLUTION
// Mirrors supabase/functions/_shared/checkin-scan.ts, which is covered
// by tests/checkin-scan.spec.ts. No build step here, so the three pure
// functions are duplicated by hand — keep them character-identical, or
// the desk and the server will disagree about what a token means.
// ═══════════════════════════════════════════════════
function resolveToken(token, roster) {
  const t = token.trim();
  const found = roster.find(a => a.qr_token === t);
  if (!found) return { kind: 'unknown_token' };
  if (found.checked_in_at) return { kind: 'duplicate', attendee: found, since: found.checked_in_at };
  return { kind: 'ok', attendee: found };
}

function searchByName(query, roster) {
  const q = query.trim().toLowerCase();
  if (q.length < 2) return [];
  return roster.filter(a =>
    `${a.first_name} ${a.last_name}`.toLowerCase().includes(q) ||
    (a.email ?? '').toLowerCase().includes(q) ||
    (a.company ?? '').toLowerCase().includes(q)
  );
}

const GENERIC_COMPANY = new Set([
  'freelance', 'freelancer', 'self employed', 'selfemployed', 'self',
  'n/a', 'na', 'none', 'nil', 'student', 'private', 'individual',
  'unemployed', 'retired', 'me', 'myself', 'guest', 'visitor', 'other',
]);

// Company is free text typed by a dozen different people, so exact
// matching splits one firm into several parties ("Acme" vs "Acme Sp. z
// o.o."). Normalising fixes that. The generic blocklist guards the
// opposite and more dangerous failure: everyone who typed "Freelance"
// would otherwise assemble into one party of strangers, each a single
// tick from being checked in.
function normalizeCompany(raw) {
  if (!raw) return null;
  let n = raw.normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
             .toLowerCase().trim().replace(/\s+/g, ' ');
  n = n.replace(/\b(sp\.?\s?z\s?o\.?\s?o\.?|s\.?a\.?|ltd|limited|llc|inc|gmbh|b\.?v\.?|oy|ab|a\/s|srl|sarl|plc|co)\b/g, '');
  n = n.replace(/[.,\-–—\s]+$/, '').replace(/\s+/g, ' ').trim();
  if (!n || GENERIC_COMPANY.has(n)) return null;
  return n;
}

const MAX_PARTY = 8;

// An arrival is one to five people from one company standing at the desk
// together, so a scan resolves to a group, not a person. A lone attendee
// is a party of one and takes the same path.
function assembleParty(anchor, roster) {
  const key = normalizeCompany(anchor.company);
  if (!key) return [anchor];
  const mates = roster.filter(a => a.id !== anchor.id && normalizeCompany(a.company) === key);
  // A party larger than a desk can handle is almost certainly a data
  // artefact, not eight colleagues standing there. Fall back to the
  // anchor alone rather than presenting a mass check-in.
  if (mates.length + 1 > MAX_PARTY) return [anchor];
  return [anchor, ...mates];
}

// ═══════════════════════════════════════════════════
// DESK — SCAN FIELD
// A USB barcode scanner is a keyboard: it types the token then sends
// Enter. So Enter is the scan path and typing is the search path, and
// one field serves both. Focus is held on it permanently so the common
// path needs no mouse.
// ═══════════════════════════════════════════════════
const scanInput = document.getElementById('scan');

function stationVisible() {
  return document.getElementById('station').style.display !== 'none';
}

// True only when focus is sitting on nothing. Reclaiming it from another
// field would eat the operator's keystrokes — Task 9 edits names inline.
function focusIsIdle() {
  const el = document.activeElement;
  if (el === scanInput) return false;
  return !el || el === document.body || el === document.documentElement;
}

function holdFocus() {
  if (!stationVisible()) return;
  if (document.activeElement === scanInput) return;
  if (!focusIsIdle()) return;
  scanInput.focus();
}

// A scanner fires its token as fast keystrokes. Any character that lands
// while the field is unfocused is lost, and a truncated token resolves to
// unknown_token — a valid badge reported to a volunteer as a bad one.
// Capture phase runs before anything else can see the key, and the event
// is NOT consumed: the character still reaches the field we just focused,
// so no polling window exists in which input can be dropped.
document.addEventListener('keydown', (e) => {
  if (!stationVisible()) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length !== 1) return;   // printable single characters only
  if (!focusIsIdle()) return;
  scanInput.focus();
}, true);

// Focus is only ever lost by an event, so react to those rather than
// polling. Deferred one tick: at focusout time the incoming element has
// not been focused yet, so activeElement still reads as body.
document.addEventListener('focusout', () => setTimeout(holdFocus, 0));
document.addEventListener('visibilitychange', () => { if (!document.hidden) holdFocus(); });
window.addEventListener('focus', holdFocus);

// Backstop only, for anything the events above miss. Runs at 5s and only
// while the desk is on screen, so it never fires after sign-out or in a
// backgrounded tab where timers are throttled anyway.
let focusBackstop = null;
function startFocusBackstop() {
  if (!focusBackstop) focusBackstop = setInterval(holdFocus, 5000);
}
function stopFocusBackstop() {
  clearInterval(focusBackstop);
  focusBackstop = null;
}

scanInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const raw = scanInput.value;
  scanInput.value = '';
  handleScan(raw);
});

scanInput.addEventListener('input', () => {
  const q = scanInput.value;
  if (q.length >= 2) renderSearchResults(searchByName(q, S.roster));
  else clearResults();
});

document.getElementById('primary').addEventListener('click', () => commitTicked({ print: true }));
document.getElementById('secondary').addEventListener('click', () => commitTicked({ print: false }));

// Task 10 owns badge printing. Stubbed so the commit path is complete.
async function printBadges(attendees) {}

// A check-in is durable the moment it is queued, not when the server
// hears about it. The outbox write comes first: crashing between the two
// writes leaves a queued item with no local state, which the next load
// replays back onto the roster. The other order would leave the desk
// showing an arrival the server is never told about.
//
// The optimistic roster write is what lets a second scan of the same
// badge answer 'already checked in' instantly with no network at all.
async function commitParty(attendees, opts) {
  const now = new Date().toISOString();   // canonical UTC — replay order compares these as strings
  for (const a of attendees) {
    const item = {
      client_id: crypto.randomUUID(),
      event_id: S.event.id,
      attendee_id: a.id,
      scanned_at: now,
      action: 'checkin',
      // Carried on every item because the server requires it on an undo:
      // it clears checked_in_at only if the stored value still matches,
      // so a stale undo cannot wipe a later check-in from another desk.
      // Always null for a check-in. Task 8 sets it on the undo path.
      prev_checked_in_at: null,
      synced: false,
    };
    await idbPutAll(STORE_OUTBOX, [item]);
    a.checked_in_at = now;
    await idbPutAll(STORE_ROSTER, [a]);
  }
  await renderPendingCount();
  renderCount();
  if (opts.print) await printBadges(attendees);
  flushOutbox();   // not awaited: the desk must not wait on the network
}

async function commitTicked(opts) {
  if (!S.party) return;
  const picked = S.party.members.filter(m => S.party.ticked.has(m.id));
  await commitParty(picked, opts);
  // The rows now read as arrived, so drop the ticks: leaving them set
  // would keep the primary button armed and invite a second commit of
  // people who are already in.
  if (S.party) picked.forEach(m => S.party.ticked.delete(m.id));
  renderParty();
  scanInput.focus();
}

function resetDesk() {
  scanInput.value = '';
  clearResults();
  clearVerdict();
  S.party = null;
  renderParty();
}

// ═══════════════════════════════════════════════════
// DESK — VERDICTS
// Every state names what the operator should do next. No error codes:
// a volunteer briefed five minutes ago cannot act on one.
// Attendee names, companies and emails are user-supplied, so every node
// below is createElement + textContent. Assigning markup is banned on
// this page: Task 12 lets a stranger type into the same roster.
// ═══════════════════════════════════════════════════
function fullName(a) { return a.first_name + ' ' + a.last_name; }

function atTime(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function clearVerdict() { document.getElementById('verdict').replaceChildren(); }

function showVerdict(tone, heading, guidance) {
  const box = document.createElement('div');
  box.className = 'ck-vd ck-vd-' + tone;
  const h = document.createElement('div');
  h.className = 'ck-vd-h';
  h.textContent = heading;
  const t = document.createElement('div');
  t.className = 'ck-vd-t';
  t.textContent = guidance;
  box.append(h, t);
  document.getElementById('verdict').replaceChildren(box);
  return box;
}

function handleScan(raw) {
  clearResults();
  const res = resolveToken(raw, S.roster);

  if (res.kind === 'unknown_token') {
    S.party = null;
    renderParty();
    const box = showVerdict('bad', "That code isn't for this event.",
      'It may be from a different event or a previous year.');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ck-quiet';
    btn.textContent = 'Search their name instead';
    btn.addEventListener('click', () => { scanInput.value = ''; scanInput.focus(); });
    box.appendChild(btn);
    renderCount();
    return;
  }

  if (res.kind === 'duplicate') {
    // Amber, not red. A second scan of the same code is routine.
    showVerdict('dup', fullName(res.attendee) + ' already checked in at ' + atTime(res.since),
      'Let them through — this is a second scan, not a second person.');
    // The party card stays. This event runs several desks, so the first
    // colleague being scanned at another station is a normal morning:
    // stranding the other three here would be the real failure.
    showParty(res.attendee);
    renderCount();
    return;
  }

  showVerdict('ok', fullName(res.attendee) + ' is on the list',
    'Tick anyone else standing here, then check them in.');
  showParty(res.attendee);
  renderCount();
}

// Name lookup always opens the party card, even when the person picked
// has already arrived: their colleagues may still be waiting, and a
// dead end would send the volunteer back to the field for no reason.
function pickAttendee(a) {
  scanInput.value = '';
  clearResults();
  if (a.checked_in_at) {
    showVerdict('dup', fullName(a) + ' already checked in at ' + atTime(a.checked_in_at),
      'Let them through. Tick anyone with them who has not arrived yet.');
  } else {
    showVerdict('ok', fullName(a) + ' is on the list',
      'Tick anyone else standing here, then check them in.');
  }
  showParty(a);
  renderCount();
  scanInput.focus();
}

// ═══════════════════════════════════════════════════
// DESK — NAME SEARCH RESULTS
// Most people cannot find their QR email, so this is the everyday path,
// not the fallback.
// ═══════════════════════════════════════════════════
const MAX_RESULTS = 8;

function clearResults() { document.getElementById('results').replaceChildren(); }

function renderSearchResults(list) {
  const host = document.getElementById('results');
  host.replaceChildren();

  if (!list.length) {
    const none = document.createElement('div');
    none.className = 'ck-res-note';
    none.textContent = 'Nobody matches that. Try fewer letters, or their company name.';
    host.appendChild(none);
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'ck-res';
  list.slice(0, MAX_RESULTS).forEach(a => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ck-res-btn';

    const main = document.createElement('div');
    main.className = 'ck-res-main';
    const name = document.createElement('div');
    name.className = 'ck-res-name';
    name.textContent = fullName(a);
    const meta = document.createElement('div');
    meta.className = 'ck-res-meta';
    meta.textContent = [a.company, a.ticket_type].filter(Boolean).join(' · ');
    main.append(name, meta);

    const pill = document.createElement('span');
    pill.className = a.checked_in_at ? 'pill-in' : 'pill-un';
    pill.textContent = a.checked_in_at ? 'arrived ' + atTime(a.checked_in_at) : 'not here yet';

    btn.append(main, pill);
    btn.addEventListener('click', () => pickAttendee(a));
    wrap.appendChild(btn);
  });
  host.appendChild(wrap);

  if (list.length > MAX_RESULTS) {
    const note = document.createElement('div');
    note.className = 'ck-res-note';
    note.textContent = 'Showing ' + MAX_RESULTS + ' of ' + list.length + '. Keep typing to narrow it down.';
    host.appendChild(note);
  }
  holdFocus();   // this render dropped the previous result buttons
}

// ═══════════════════════════════════════════════════
// DESK — PARTY CARD
// The person who scanned is pre-ticked; colleagues start unticked so
// nobody is checked in who is not standing there. Status is written in
// words, not colour alone: lobby lighting is bad and some of the crew
// are colour blind.
// ═══════════════════════════════════════════════════
function showParty(anchor) {
  const members = assembleParty(anchor, S.roster);
  const ticked = new Set(anchor.checked_in_at ? [] : [anchor.id]);
  S.party = { members, ticked };
  renderParty();
}

function partyRow(attendee, ticked, onToggle) {
  const row = document.createElement('div');
  row.className = 'prow';

  const tick = document.createElement('button');
  tick.className = attendee.checked_in_at ? 'tick done' : (ticked ? 'tick on' : 'tick');
  tick.textContent = (attendee.checked_in_at || ticked) ? '✓' : '';
  tick.disabled = !!attendee.checked_in_at;
  tick.addEventListener('click', () => onToggle(attendee));
  row.appendChild(tick);

  const who = document.createElement('div');
  const name = document.createElement('div');
  name.className = 'pn';
  name.textContent = `${attendee.first_name} ${attendee.last_name}`;
  const meta = document.createElement('div');
  meta.className = 'pm';
  meta.textContent = attendee.ticket_type;
  who.append(name, meta);
  row.appendChild(who);

  // Three states, never two. A ticked row saying "not here yet" next to a
  // filled tick reads as a contradiction to someone briefed five minutes
  // ago: the tick is intent, the pill is what the system has recorded.
  const status = document.createElement('span');
  if (attendee.checked_in_at) {
    status.className = 'pill-in';
    status.textContent = `arrived ${new Date(attendee.checked_in_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  } else if (ticked) {
    status.className = 'pill-go';
    status.textContent = 'checking in…';
  } else {
    status.className = 'pill-un';
    status.textContent = 'not here yet';
  }
  row.appendChild(status);

  return row;
}

function renderParty() {
  const host = document.getElementById('party');
  host.replaceChildren();

  if (!S.party) {
    document.getElementById('actions').style.display = 'none';
    holdFocus();
    return;
  }

  const members = S.party.members;
  const card = document.createElement('div');
  card.className = 'ck-party';

  const hd = document.createElement('div');
  hd.className = 'ck-party-hd';
  const co = document.createElement('div');
  co.className = 'ck-party-co';
  co.textContent = members[0].company || fullName(members[0]);
  const sub = document.createElement('div');
  sub.className = 'ck-party-sub';
  const arrived = members.filter(m => m.checked_in_at).length;
  sub.textContent =
    (members.length === 1 ? '1 person expected' : members.length + ' people expected') +
    ' · ' + (arrived === 0 ? 'none here yet' : arrived + ' already arrived');
  hd.append(co, sub);
  card.appendChild(hd);

  members.forEach(m => card.appendChild(partyRow(m, S.party.ticked.has(m.id), toggleMember)));
  host.appendChild(card);

  document.getElementById('actions').style.display = 'flex';
  renderPrimary(S.party.ticked.size);
  // This render replaced every row, so the tick the operator just clicked
  // no longer exists and focus has fallen back to the body. Reclaim it
  // now rather than waiting for a timer.
  holdFocus();
}

// Re-rendering the whole card on every toggle also drops the clicked
// button out of the DOM, which returns focus to the body so the next
// scan still lands in the field.
function toggleMember(attendee) {
  if (!S.party) return;
  if (S.party.ticked.has(attendee.id)) S.party.ticked.delete(attendee.id);
  else S.party.ticked.add(attendee.id);
  renderParty();
}

// The label states exactly what the button is about to do, so a
// volunteer never has to guess how many people they are committing. With
// nothing ticked it names the next action instead of reading "Check in 0
// · Print 0 badges", which is a dead state that invites hammering.
function renderPrimary(count) {
  const btn = document.getElementById('primary');
  btn.textContent = count === 0
    ? 'Tick who is here'
    : (count === 1
        ? 'Check in 1 · Print 1 badge'
        : `Check in ${count} · Print ${count} badges`);
  btn.disabled = count === 0;
}
</script>
</body>
</html>
